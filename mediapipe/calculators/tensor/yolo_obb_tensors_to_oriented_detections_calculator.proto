syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

// Options for YoloObbTensorsToOrientedDetectionsCalculator: anchor-free
// decoding of Ultralytics YOLOv8/v11-OBB output. Channel order per anchor is
// [cx, cy, w, h, cls_0..cls_{num_classes-1}, angle]; angle is the LAST channel.
message YoloObbTensorsToOrientedDetectionsCalculatorOptions {
  extend .mediapipe.CalculatorOptions {
    optional YoloObbTensorsToOrientedDetectionsCalculatorOptions ext = 471230002;
  }

  enum Layout {
    LAYOUT_UNSPECIFIED = 0;
    CHANNELS_FIRST = 1;  // [N, 4 + num_classes + 1, A]
    CHANNELS_LAST = 2;   // [N, A, 4 + num_classes + 1]
  }
  optional Layout layout = 1 [default = CHANNELS_FIRST];

  // [Required] Number of object classes.
  optional int32 num_classes = 2;

  optional float conf_threshold = 3 [default = 0.25];

  // Per batch row, keep at most this many highest-scoring candidates before
  // NMS. -1 keeps all candidates above conf_threshold.
  optional int32 max_detections_before_nms = 4 [default = 300];

  // Class-index filter during decode (before conf-threshold / cap). Mutually
  // exclusive; empty (default) = no filtering.
  repeated int32 allow_classes = 5 [packed = true];
  repeated int32 ignore_classes = 6 [packed = true];
}
