syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

message StreamingTilesToTensorBatchCalculatorOptions {
  extend .mediapipe.CalculatorOptions {
    optional StreamingTilesToTensorBatchCalculatorOptions ext = 471230005;
  }
  // If true, treat the model as dynamic-batch (emit N = valid_count, no
  // padding). If false (fixed batch), emit N = batch_capacity with padding.
  // METADATA.is_dynamic_batch overrides this when set.
  optional bool dynamic_batch = 1 [default = false];

  // Maximum number of distinct tile-set geometries (matrices + ROIs) to cache,
  // keyed by frame size + tile set. 0 = disabled (default). N > 0 caches the
  // last N distinct (frame width, frame height, tile geometry list) inputs.
  // Pixels are NEVER cached; the crop/resize/normalize loop always runs every
  // frame. Only the matrix and ROI computation is skipped on a cache hit.
  optional int32 max_cached_tile_matrices = 2 [default = 0];

  // 0 = disabled (per-batch alloc, unchanged); N > 0 = pool up to N batch
  // tensor buffers in a calculator-local MemoryManager, reused after each
  // batch packet is released downstream.
  optional int32 max_cpu_tensor_workspaces = 3 [default = 0];

  // When true AND a CACHE_STATS output is connected, emit cumulative stats
  // once per source frame at the source timestamp. Must not allocate on the
  // hot path when false or when CACHE_STATS is unconnected.
  optional bool emit_cache_stats = 4 [default = false];

  // ---- GPU zero-copy path (Plan 4). All default off; the CPU path above is
  // byte-identical when enable_gpu_zero_copy is false. ----

  // Cache 5: max GPU/AHWB-backed batch tensor buffers to pool. Required (> 0)
  // when enable_gpu_zero_copy is set. Pooling is effective on AHWB-capable
  // platforms (Android); on GL-without-AHWB and on Metal the framework has no
  // buffer pool, so allocation is per batch and this only bounds the config.
  optional int32 max_gpu_tensor_buffers = 5 [default = 0];

  // When true AND a GPU input (IMAGE_GPU) is connected, run tiled
  // crop/resize/normalize on the GPU, writing each tile into its row of a
  // GPU/AHWB-backed [N,H,W,C] tensor with no CPU readback. Default off => CPU
  // path exactly. A frame without a usable GPU input falls back to the CPU
  // path and is counted in TilingCacheStats.gpu_to_cpu_fallbacks.
  optional bool enable_gpu_zero_copy = 7 [default = false];

  // Removed options that promised behavior which was never implemented
  // (fallback toggles, tile-surface cache cap, in-flight cap):
  //   6: max_tile_surfaces, 8: allow_cpu_input_fallback,
  //   9: max_in_flight_gpu_batches, 10: allow_gpu_readback_fallback.
  reserved 6, 8, 9, 10;
  reserved "max_tile_surfaces", "allow_cpu_input_fallback",
      "max_in_flight_gpu_batches", "allow_gpu_readback_fallback";

  // Apple/Metal only. When true (and enable_gpu_zero_copy + IMAGE_GPU), emit a
  // PHYSICAL PHWC4 float32 [1,H,W,RoundUp(C,4)] Metal tensor per batch for
  // direct delegate binding (pair with InferenceCalculatorMetal
  // metal_external_input_zero_copy=true). Requires N==1 and C<=4; fails loudly
  // otherwise. Default off => the logical [N,H,W,C] Metal path (unchanged).
  optional bool metal_direct_delegate_input = 11 [default = false];
}
