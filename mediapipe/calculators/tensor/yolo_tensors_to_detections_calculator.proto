syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

// Options for YoloTensorsToDetectionsCalculator: anchor-free decoding of
// Ultralytics YOLOv8/v11 detect-head output tensors.
message YoloTensorsToDetectionsCalculatorOptions {
  extend .mediapipe.CalculatorOptions {
    optional YoloTensorsToDetectionsCalculatorOptions ext = 471230001;
  }

  // Memory layout of the model's detect output tensor.
  enum Layout {
    LAYOUT_UNSPECIFIED = 0;
    // [N, 4 + num_classes, A]  (Ultralytics default export)
    CHANNELS_FIRST = 1;
    // [N, A, 4 + num_classes]
    CHANNELS_LAST = 2;
  }
  optional Layout layout = 1 [default = CHANNELS_FIRST];

  // [Required] Number of object classes (channels after the 4 box values).
  optional int32 num_classes = 2;

  // Minimum class probability for a candidate to be emitted.
  optional float conf_threshold = 3 [default = 0.25];

  // Per batch row, keep at most this many highest-scoring candidates before
  // NMS. -1 keeps all candidates above conf_threshold.
  optional int32 max_detections_before_nms = 4 [default = 300];

  // Tile-local NMS: after conf-threshold + top-K, suppress duplicate candidates
  // WITHIN this batch row (one tile). IoU above this threshold suppresses the
  // lower-scoring box. 0 = disabled (no tile-local NMS; default, unchanged).
  // This is NOT the final frame-level NMS; it never compares across rows/tiles.
  optional float tile_local_nms_iou_threshold = 5 [default = 0.0];

  // After tile-local NMS, keep at most this many highest-scoring candidates per
  // row. 0 = no post-cap (default).
  optional int32 max_detections_after_tile_nms = 6 [default = 0];

  // If true, tile-local NMS suppresses across classes; if false (default), only
  // boxes with the same label_id suppress each other.
  optional bool tile_local_nms_class_agnostic = 7 [default = false];

  // When BOTH > 0, the model emits box cx,cy,w,h in input-PIXEL space; divide
  // cx,w by input_width and cy,h by input_height to produce the normalized
  // [0,1] relative_bounding_box this calculator outputs. 0 (default) = boxes are
  // already normalized [0,1] (unchanged: the tiled-detection pipeline and prior
  // callers feed normalized boxes).
  optional int32 input_width = 8 [default = 0];
  optional int32 input_height = 9 [default = 0];

  // Class-index filter applied during decode (before conf-threshold / cap).
  // Mutually exclusive. Empty (default) = no filtering (unchanged). Mirrors
  // TensorsToDetectionsCalculatorOptions.allow_classes/ignore_classes.
  repeated int32 allow_classes = 10 [packed = true];
  repeated int32 ignore_classes = 11 [packed = true];
}
