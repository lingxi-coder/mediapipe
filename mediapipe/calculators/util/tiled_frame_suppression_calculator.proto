syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

message TiledFrameSuppressionCalculatorOptions {
  extend mediapipe.CalculatorOptions {
    optional TiledFrameSuppressionCalculatorOptions ext = 471230007;
  }
  // IoU above which the lower-scoring box is suppressed by global NMS.
  optional float iou_threshold = 1 [default = 0.5];
  // If true, global NMS suppresses across classes; else only same label_id.
  optional bool class_agnostic = 2 [default = false];
  // If true, allow the single-tile/no-tracker pass-through bypass (skip the NMS
  // call when there is nothing cross-source to dedup). Default false = always
  // run global NMS.
  optional bool bypass_single_tile = 3 [default = false];
  // When true, before the global NMS, drop every TRACKER_DETECTIONS box that
  // overlaps any fresh DETECTIONS box (IoU >= iou_threshold, honoring
  // class_agnostic) so fresh detections always win and the tracker only fills
  // gaps. Default false = today's blind concatenate-then-NMS behavior.
  optional bool tracker_is_gap_fill_only = 4 [default = false];
}
