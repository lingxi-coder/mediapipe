syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

// Options for RotatedNonMaxSuppressionCalculator. Greedy NMS over oriented
// detections using rotated-rectangle IoU.
message RotatedNonMaxSuppressionCalculatorOptions {
  extend .mediapipe.CalculatorOptions {
    optional RotatedNonMaxSuppressionCalculatorOptions ext = 471230003;
  }

  // A detection suppresses a lower-scoring one if their rotated IoU is at or
  // above this threshold.
  optional float iou_threshold = 1 [default = 0.45];

  // Maximum detections to return (after suppression). -1 = no limit.
  optional int32 max_detections = 2 [default = -1];

  // If true, suppression ignores class; otherwise only detections sharing the
  // top label_id can suppress each other.
  optional bool class_agnostic = 3 [default = false];
}
