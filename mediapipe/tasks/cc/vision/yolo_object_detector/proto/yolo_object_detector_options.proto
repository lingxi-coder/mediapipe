syntax = "proto2";

package mediapipe.tasks.vision.yolo_object_detector.proto;

import "mediapipe/framework/calculator.proto";
import "mediapipe/framework/calculator_options.proto";
import "mediapipe/tasks/cc/core/proto/base_options.proto";

option java_package = "com.google.mediapipe.tasks.vision.yoloobjectdetector.proto";
option java_outer_classname = "YoloObjectDetectorOptionsProto";

message YoloObjectDetectorOptions {
  extend mediapipe.CalculatorOptions {
    optional YoloObjectDetectorOptions ext = 471230010;
  }
  // Base options for configuring MediaPipe Tasks, such as specifying the TfLite
  // model file with metadata, accelerator options, etc.
  optional core.proto.BaseOptions base_options = 1;

  // The locale to use for display names specified through the TFLite Model
  // Metadata, if any. Defaults to English.
  optional string display_names_locale = 2 [default = "en"];

  // The maximum number of top-scored detection results to return. If < 0, all
  // available results will be returned.
  optional int32 max_results = 3 [default = -1];

  // Score threshold to override the one provided in the model metadata (if
  // any). Detection results with a score below this value are rejected.
  optional float score_threshold = 4 [default = 0.25];

  // Optional allowlist of category names. If non-empty, detection results whose
  // category name is not in this set will be filtered out. Duplicate or unknown
  // category names are ignored. Mutually exclusive with category_denylist.
  repeated string category_allowlist = 5;

  // Optional denylist of category names. If non-empty, detection results whose
  // category name is in this set will be filtered out. Duplicate or unknown
  // category names are ignored. Mutually exclusive with category_allowlist.
  repeated string category_denylist = 6;

  // YOLO axis-aligned NMS IoU threshold.
  optional float iou_threshold = 7 [default = 0.45];

  // Output tensor layout of the YOLO detect head.
  enum Layout {
    LAYOUT_UNSPECIFIED = 0;
    CHANNELS_FIRST = 1;
    CHANNELS_LAST = 2;
  }
  optional Layout layout = 8 [default = CHANNELS_FIRST];

  // Number of classes. If unset (0), derived from model metadata at build time.
  optional int32 num_classes = 9 [default = 0];

  // Static tiling configuration. Tiling is ENABLED when
  // tile_rows * tile_cols > 1 or explicit_tiles is non-empty; otherwise the
  // single-image path is used unchanged.
  message TilingOptions {
    // Uniform grid of tile_rows x tile_cols tiles, neighbors overlapping by
    // tile_overlap_fraction of the tile side length, in [0, 1).
    optional int32 tile_rows = 1 [default = 1];
    optional int32 tile_cols = 2 [default = 1];
    optional float tile_overlap_fraction = 3 [default = 0.0];
    message TileRect {
      optional float x_center = 1;
      optional float y_center = 2;
      optional float width = 3;
      optional float height = 4;
    }
    // Frame-normalized explicit tiles; mutually exclusive with the grid params.
    repeated TileRect explicit_tiles = 4;
    // Per-tile (in-decoder) NMS; <= 0 disables.
    optional float tile_local_nms_iou_threshold = 5 [default = 0.0];
    // Per-tile cap after tile-local NMS; <= 0 disables.
    optional int32 max_detections_after_tile_nms = 6 [default = 0];
    // VIDEO/LIVE_STREAM only: gate per-frame tiled inference with a motion
    // scheduler; low-motion (near-duplicate) frames SKIP inference and the
    // BoxTracker fills them. Rejected in IMAGE mode.
    optional bool enable_motion_scheduling = 7 [default = false];
    // When scheduling, cap how many tiles are inferred per DETECT frame
    // (motion-prioritized). 0 = uncapped (all tiles).
    optional int32 max_scheduled_tiles = 8 [default = 0];
  }
  optional TilingOptions tiling = 10;

  // Tracker selection for the tiled VIDEO/LIVE_STREAM path. tracker_type is
  // honored only when tiling is enabled and running mode is not IMAGE
  // (validated at Create()); otherwise there is no tracker node.
  //
  // NOTE: BoTSORT only emits a track_id for confirmed tracks. Set
  // track_high_threshold / new_track_threshold at or below your detection
  // score_threshold, otherwise low-confidence detections never confirm and no
  // track_id is ever produced.
  message TrackingOptions {
    enum TrackerType {
      TRACKER_UNSPECIFIED = 0;  // -> BOX_TRACKER
      BOX_TRACKER = 1;          // optical-flow propagation (existing default)
      BOTSORT = 2;              // tracking-by-detection, motion-only
    }
    optional TrackerType tracker_type = 1 [default = BOX_TRACKER];
    optional float track_high_threshold = 2 [default = 0.6];
    optional float track_low_threshold = 3 [default = 0.1];
    optional float new_track_threshold = 4 [default = 0.7];
    optional int32 track_buffer = 5 [default = 30];
    optional float match_threshold = 6 [default = 0.7];
    optional bool enable_gmc = 7 [default = false];
  }
  optional TrackingOptions tracking = 11;
}
