syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";
import "mediapipe/calculators/tensor/tile_grid_calculator.proto";

// Options for the tiled-detection front subgraph: splits an input frame into
// tiles and assembles them into model-input tensor batches.
message TiledDetectionFrontGraphOptions {
  extend .mediapipe.CalculatorOptions {
    optional TiledDetectionFrontGraphOptions ext = 471230013;
  }
  // Forwarded verbatim to the internal TileGridCalculator.
  optional TileGridCalculatorOptions tile_grid = 1;
  // Model-input metadata, forwarded to StreamingTilesToTensorBatch's
  // options-borne metadata fields (the graph builder fills these at build
  // time).
  optional int32 batch_capacity = 2 [default = 0];
  optional int32 input_height = 3 [default = 0];
  optional int32 input_width = 4 [default = 0];
  optional int32 input_channels = 5 [default = 0];
  optional bool is_dynamic_batch = 6 [default = false];
}

// Options for the tiled OBB (oriented bounding box) merge subgraph: merges
// per-tile detections back into frame space and runs global rotated NMS.
message TiledObbMergeGraphOptions {
  extend .mediapipe.CalculatorOptions {
    optional TiledObbMergeGraphOptions ext = 471230014;
  }
  // IoU threshold for the global rotated NMS across merged tile detections.
  optional float iou_threshold = 1 [default = 0.45];
  // Cap on the number of kept detections after NMS; -1 means uncapped.
  optional int32 max_detections = 2 [default = -1];
  // If true, NMS suppresses across classes (class labels are ignored).
  optional bool class_agnostic = 3 [default = false];
}

// Options for the tiled axis-aligned box merge subgraph: merges per-tile
// detections back into frame space and runs global NMS.
message TiledBoxMergeGraphOptions {
  extend .mediapipe.CalculatorOptions {
    optional TiledBoxMergeGraphOptions ext = 471230015;
  }
  // IoU threshold for the global NMS across merged tile detections.
  optional float iou_threshold = 1 [default = 0.45];
  // If true, NMS suppresses across classes (class labels are ignored).
  optional bool class_agnostic = 2 [default = false];
  // Cap on the number of kept detections after NMS; -1 means uncapped.
  optional int32 max_detections = 3 [default = -1];
}
