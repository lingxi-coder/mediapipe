syntax = "proto2";

package mediapipe;

option java_package = "com.google.mediapipe.formats.proto";
option java_outer_classname = "OrientedDetectionProto";

// An oriented (rotated) bounding box detection. Geometry is a center point,
// size, and rotation angle, all in coordinates normalized to [0, 1] relative
// to the enclosing image frame (origin at the top-left corner).
//
// COORDINATE-SPACE CONVENTION: every field, INCLUDING rotation, describes the
// box in the frame-normalized space — rotation is the angle of the box's
// width-axis measured in normalized units, not in pixels. On a non-square
// frame the normalized space is anisotropic with respect to pixels, so the
// normalized-space box is not the pixel-space box rotated rect; consumers
// that need pixel-space geometry (rendering, pixel-accurate IoU) must map
// through the frame aspect ratio first. All shipped producers/consumers
// (YoloObb decode, MergeTileDetectionsAccumulator, RotatedNonMaxSuppression,
// OrientedDetectionProjection) read and write this normalized convention.
message OrientedDetection {
  optional float cx = 1;        // box center x, normalized [0,1], origin top-left
  optional float cy = 2;        // box center y, normalized [0,1], origin top-left
  optional float width = 3;     // normalized [0,1]
  optional float height = 4;    // normalized [0,1]
  optional float rotation = 5;  // radians, counter-clockwise, in normalized space

  // Parallel arrays: the i-th label / label_id has its score in score[i].
  // display_name (if present) is the human-readable form of the i-th label.
  repeated string label = 6;
  repeated int32 label_id = 7 [packed = true];
  repeated float score = 8 [packed = true];
  repeated string display_name = 9;

  optional int64 detection_id = 10;
  optional string track_id = 11;       // populated by tracking (later group)
  optional int64 timestamp_usec = 12;
}

message OrientedDetectionList {
  repeated OrientedDetection detection = 1;
}
